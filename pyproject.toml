[project]
name = "shadow-peft"
version = "0.1.0"
description = "ShadowPEFT: Shadow Network for Parameter-Efficient Fine-Tuning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ShadowLLM" }]
dependencies = [
  "torch>=2.1",
  "transformers>=5.5.0",
  "safetensors>=0.4.3",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.31.2; platform_system == 'Darwin'",
  "mlx-lm>=0.31.3",
]
quant = [
  # Backbone PTQ tiers (w8a8_fp8 / w4a16) for shadow_lab.
  "torchao>=0.18,<0.19",
]
angelslim = [
  # Compression-engine bridge (shadow_lab.slim): calibration-based backbone
  # PTQ (GPTQ/AWQ/nvfp4), QAD/Distill arms, sparsity, AngelSpec drafters.
  "angelslim>=0.5.0",
]
experiment = [
  # shadow_lab training & eval stack.
  "datasets>=2.19",
  "trl>=0.20",
]

[project.urls]
Repository = "https://github.com/ShadowLLM/shadow-peft"

[project.scripts]
shadow-annotate = "shadow_lab.annotation.cli:main"
edge-cloud = "edge_cloud.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadow_core", "src/shadow_lab", "src/shadow_peft", "src/shadow_peft_mlx", "src/edge_cloud"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "B", "SIM"]
lint.ignore = ["E501","B028"]

[tool.ruff.lint.isort]
known-first-party = ["shadow_core", "shadow_lab", "shadow_peft", "shadow_peft_mlx"]
